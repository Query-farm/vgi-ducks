# Notebook-only rules; SQL magic creates the captured DataFrame names.
line-length = 120
target-version = "py313"
exclude = ["virginia_support.py", "virginia-ducks.source.ipynb", "spatial-migration.ipynb"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[lint.per-file-ignores]
"*.ipynb" = ["F821"]

[lint.pydocstyle]
convention = "google"
