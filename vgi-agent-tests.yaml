# API tasks require EBIRD_API_KEY when running the optional L3 agent check.
tasks:
  - name: mallard_code
    reference_sql: SELECT species_code, scientific_name FROM ducks.main.species WHERE common_name = 'Mallard' ORDER BY species_code
  - name: nearby_ducks
    reference_sql: SELECT common_name, observed_at_local FROM ducks.main.recent_sightings(42.36, -71.06) ORDER BY common_name
  - name: birding_hotspots
    reference_sql: SELECT location_name, distance_km FROM ducks.main.nearby_hotspots(42.36, -71.06) ORDER BY distance_km, location_name LIMIT 5
  - name: seasonal_ranges
    reference_sql: SELECT season, start_date, end_date, wraps_year FROM ducks.main.seasonal_ranges('yebsap-example') ORDER BY season
  - name: weekly_abundance
    reference_sql: SELECT week_date, mean_relative_abundance, coverage_fraction FROM ducks.main.weekly_abundance('yebsap-example', 'POLYGON((-90 41,-82 41,-82 49,-90 49,-90 41))') ORDER BY week_date
  - name: migration_calendar
    reference_sql: SELECT week_date, mean_relative_abundance, coverage_fraction FROM ducks.main.migration_calendar('yebsap-example', 'POLYGON((-90 41,-82 41,-82 49,-90 49,-90 41))') ORDER BY week_date
